<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MapleForge</title>
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta
      name="description"
      content="MapleForge, a Canadian community building together."
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #fff;
        color: #203c32;
        font-family: Arial, Helvetica, sans-serif;
      }
      main {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 30px 20px;
      }
      h1 {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: clamp(32px, 5vw, 54px);
        margin: 0 0 28px;
        letter-spacing: -1.5px;
      }
      h1 img {
        width: 46px;
        height: 50px;
      }
      .community {
        display: block;
        width: min(1200px, 100%);
        height: auto;
      }
      .explore {
        display: inline-block;
        background: #b7482b;
        color: white;
        padding: 12px 25px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 700;
        margin-top: 18px;
      }
      .explore:focus-visible {
        outline: 3px solid #203c32;
        outline-offset: 4px;
      }
    h1 img.wordmark { width: min(85vw, 560px); height: auto; }
    </style>
  </head>
  <body>
    <main>
      <h1><img class="wordmark" src="/mapleforge-wordmark-transparent.png" alt="MapleForge" /></h1>
      <img
        class="community"
        src="/community.png"
        alt="An inclusive illustrated Canadian community, including Indigenous participants, collaborating around a shared table."
      />
    </main>
  </body>
</html>
