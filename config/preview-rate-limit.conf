# Install in nginx's http context, for example /etc/nginx/conf.d/.
# Only password submissions count. Do not trust client-supplied forwarding headers.
map $request_method $mapleforge_preview_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $mapleforge_preview_key zone=mapleforge_preview:10m rate=6r/m;
# Add to the existing location = /preview-access block:
# limit_req zone=mapleforge_preview burst=5 nodelay;
# limit_req_status 429;
